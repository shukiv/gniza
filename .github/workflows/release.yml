# Publish the WHM plugin when a version tag is pushed.
#
# The tag is the publish: a branch push builds nothing, so a release exists
# only because somebody named a version. It runs the same `make plugin` that
# builds the tarball locally -- statically linked, -trimpath, so no path or
# host of the runner ends up in the binary.
#
# It can also be run by hand from the Actions tab, which builds and stops:
# publishing is gated on the ref being a tag. That is how the build is
# exercised before a version is named.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe stamps the version into the binary, and a shallow
          # checkout has no tags to describe against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      # A release is a static binary that sits on somebody's server until
      # somebody replaces it, so a known hole in the standard library or a
      # dependency ships for as long as the release lives. Fail here rather
      # than publish one.
      - name: Known vulnerabilities
        run: make vuln

      # Both packages: "make plugin" builds the DirectAdmin one as well,
      # because get.sh installs whichever panel the server it runs on has
      # and both are checked against the one signed SHA256SUMS.
      - name: Build the plugin tarballs
        run: make plugin

      # And check the artifact itself, not only the source it was built
      # from: the toolchain stamped in the binary is the standard library
      # every server will run.
      - name: What the binary was built from
        run: make provenance

      # Signed with the release key, whose public half is in get.sh and in
      # the repository. The checksums say a download arrived whole; the
      # signature over them says the release came from whoever holds that
      # key, which is what an installer running as root is entitled to ask.
      - name: Sign the checksums
        env:
          # Renamed with the project. Set it with:
          #   gh secret set GNIZA_SIGNING_KEY --repo shukiv/gniza < release.pem
          # An unset secret fails this step rather than publishing unsigned.
          SIGNING_KEY: ${{ secrets.GNIZA_SIGNING_KEY }}
        run: |
          set -eu
          [ -n "${SIGNING_KEY:-}" ] || { echo "GNIZA_SIGNING_KEY is not set; a release has to be signed" >&2; exit 1; }
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out bin/SHA256SUMS.sig bin/SHA256SUMS
          # Verify with the committed public key, so a mismatched secret
          # fails here rather than on somebody's server.
          openssl dgst -sha256 -verify internal/update/release.pub \
            -signature bin/SHA256SUMS.sig bin/SHA256SUMS

      # A run started by hand is a build of whatever master is, published
      # on the dist branch for the servers that follow the work rather
      # than the releases (Settings -> Where updates come from). The key
      # lives only here, so this is the one place a dist build can be
      # signed. A tag push publishes a release below instead, never both:
      # a server on the dist channel orders builds by commit time, and a
      # release has none, so putting one there would offer it to nobody.
      - name: Publish the build on the dist branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          git config user.name "gniza release workflow"
          git config user.email "release@gniza.invalid"
          git fetch --quiet origin "+refs/heads/dist:refs/remotes/origin/dist" || true
          sh packaging/whm/publish-dist.sh bin "$(git describe --tags --always)"

      # get.sh is published as an asset of its own so that the one-line
      # install fetches it from the release rather than from a branch: what
      # somebody pipes into a root shell is then a named version with its
      # checksum published beside it, not whatever master says today.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          set -- --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            set -- "$@" --notes-file "$notes"
            # A compatibility candidate must not become the latest stable
            # update simply because its version tag was pushed.
            if grep -qx 'Release channel: prerelease' "$notes"; then
              set -- "$@" --prerelease --latest=false
            fi
          else
            set -- "$@" --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" "$@" \
            bin/cprest-plugin-amd64.tar.gz \
            bin/gniza-directadmin-amd64.tar.gz \
            bin/gniza-plain-amd64.tar.gz \
            bin/SHA256SUMS \
            bin/SHA256SUMS.sig \
            bin/get.sh
