id=gniza
name=Gniza
author=Gniza
# Rewritten with the version that was built when the package is made;
# this is what the card in DirectAdmin's plugin manager shows.
version=0.0.0-source
active=yes
installed=yes
# The account DirectAdmin runs the administrator's page as. DirectAdmin
# will not run a plugin as root -- "Must not be uid=0 and must exist" --
# so the page cannot open Gniza's root-only socket, and it does not try:
# it opens a socket of its own that this account owns, and Gniza checks
# the DirectAdmin session the page was given before serving anything.
# The installer creates this account. See ADR 0020.
admin_run_as=gniza-plugin
# There is deliberately no user_run_as. Without one DirectAdmin runs the
# account's page as the account itself, which is what lets Gniza read the
# customer's identity from the socket instead of taking the page's word
# for it.
